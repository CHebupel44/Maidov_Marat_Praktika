    <script>
    	const fetchWithTimeout = (url, ms) => Promise.race([
  fetch(url).then(res => res.json()),
  new Promise((_, reject) => setTimeout(() => reject(new Error('Таймаут')), ms))
]);

const url = 'https://wttr.in';

// Тестирование
async function test() {
  try {
    const data = await fetchWithTimeout(url, 100);
    console.log('Чотко 100мс:', data);
  } catch (err) {
    console.error('Ошибка 100мс:', err.message);
  }

  try {
    const data = await fetchWithTimeout(url, 5000);
    console.log('Чотко 5000мс. Температура:', data.current_condition[0].temp_C);
  } catch (err) {
    console.error('Ошибка 5000мс:', err.message);
  }
}

test();
    </script>
