<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 5</title>
</head>
<body>
    <h1>0o0</h1>
    <img src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcTLKy1q-Kr0eTVn_2JDSszKFyYVnrlCdi_tdEKwHss2RheCEcOA" alt="груснявка" width="400">

    <script>
        function getMoscowWeather() {
            fetch('https://api.open-meteo.com/v1/forecast?latitude=55.75&longitude=37.61&current_weather=true')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Ошибка сервера: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const temp = data.current_weather.temperature;
                    console.log(`Погода в Москве: ${temp}°C`);
                })
                .catch(error => {
                    console.error('Хьюстон у нас проблемы при запросе:', error);
                })
                .finally(() => {
                    console.log('Все чотко сделано!');
                });
        }

        getMoscowWeather();
    </script>
</body>
</html>
