    <script>
function getThreeCitiesWeather() {
    const urls = [
        'https://wttr.in/Moscow?format=j1',
        'https://wttr.in/London?format=j1',
        'https://wttr.in/Paris?format=j1'
    ];

    const cityNames = ['Москва', 'Лондон', 'Париж'];

    const requests = urls.map(url => 
        fetch(url).then(response => {
            if (!response.ok) {
                throw new Error(`Ошибка загрузки: ${response.status}`);
            }
            return response.json();
        })
    );

    Promise.all(requests)
        .then(results => {
            results.forEach((data, index) => {
                const temp = data.current_condition[0].temp_C;
                console.log(`${cityNames[index]}: ${temp}°C`);
            });
        })
        .catch(error => {
            console.error('Произошла ошибка при выполнении Promise.all:', error);
        });
}

getThreeCitiesWeather();
    </script>
</body>
